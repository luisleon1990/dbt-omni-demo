version: 2

# Ratio metrics take other metrics (not measures) as numerator and denominator,
# so every ratio input below has its own simple metric.

metrics:
  # plays (Big Data Bowl targeted passes only: no runs, sacks or scrambles)
  - name: total_plays
    label: Total targeted passes
    type: simple
    type_params:
      measure: play_count

  - name: pass_attempts
    label: Pass attempts
    type: simple
    type_params:
      measure: pass_attempts

  - name: completions
    label: Completions
    type: simple
    type_params:
      measure: completions

  - name: interceptions
    label: Interceptions
    type: simple
    type_params:
      measure: interceptions

  - name: yards_gained
    label: Yards gained
    type: simple
    type_params:
      measure: yards_gained

  - name: expected_points_added
    label: Expected points added
    type: simple
    type_params:
      measure: expected_points_added

  - name: completion_pct
    label: Completion %
    description: Completions divided by pass attempts.
    type: ratio
    type_params:
      numerator: completions
      denominator: pass_attempts

  - name: interception_rate
    label: Interception rate
    description: Interceptions divided by pass attempts.
    type: ratio
    type_params:
      numerator: interceptions
      denominator: pass_attempts

  - name: yards_per_play
    label: Yards per targeted pass
    description: Yards gained per targeted pass. Not full-offense yards per play, because the data has no runs or sacks.
    type: ratio
    type_params:
      numerator: yards_gained
      denominator: total_plays

  - name: epa_per_play
    label: EPA per targeted pass
    description: Expected points added per targeted pass. Not full-offense EPA per play, because the data has no runs or sacks.
    type: ratio
    type_params:
      numerator: expected_points_added
      denominator: total_plays

  # player stats
  - name: passing_yards
    label: Passing yards
    type: simple
    type_params:
      measure: passing_yards

  - name: passing_tds
    label: Passing TDs
    type: simple
    type_params:
      measure: passing_tds

  - name: rushing_yards
    label: Rushing yards
    type: simple
    type_params:
      measure: rushing_yards

  - name: receiving_yards
    label: Receiving yards
    type: simple
    type_params:
      measure: receiving_yards

  - name: receptions
    label: Receptions
    type: simple
    type_params:
      measure: receptions

  - name: targets
    label: Targets
    type: simple
    type_params:
      measure: targets

  - name: fantasy_points_ppr
    label: Fantasy points (PPR)
    type: simple
    type_params:
      measure: fantasy_points_ppr

  - name: catch_rate
    label: Catch rate
    description: Receptions divided by targets.
    type: ratio
    type_params:
      numerator: receptions
      denominator: targets

  # games
  - name: games_played
    label: Games played
    type: simple
    type_params:
      measure: games_played

  - name: total_points
    label: Total points
    type: simple
    type_params:
      measure: total_points

  - name: points_per_game
    label: Points per game
    description: Total points scored by both teams divided by games played.
    type: ratio
    type_params:
      numerator: total_points
      denominator: games_played
